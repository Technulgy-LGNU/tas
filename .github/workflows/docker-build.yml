name: Verify and build TAS

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to publish (also tagged with the full commit SHA)
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.image_tag || 'check' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    name: Frontend and backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tas_ci
          POSTGRES_PASSWORD: tas_ci
          POSTGRES_DB: tas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tas_ci -d tas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npx eslint .
          npx oxlint .
          npm run build

      - name: Configure isolated PostgreSQL tests
        run: |
          cat > "$RUNNER_TEMP/tas-ci.toml" <<'TOML'
          [database]
          host = "127.0.0.1"
          port = 5432
          user = "tas_ci"
          password = "tas_ci"
          database = "tas_ci"
          timezone = "Europe/Berlin"
          TOML

      - name: Test backend including website persistence
        env:
          TAS_TEST_CONFIG: ${{ runner.temp }}/tas-ci.toml
        run: |
          go vet ./backend/...
          go test -race -count=1 ./backend/...

      - name: Validate Compose and example configuration
        run: |
          docker compose --env-file .env.example config --quiet
          python3 -c 'import tomllib; tomllib.load(open("config.example.toml", "rb"))'

  docker:
    name: Build container (publish on manual runs)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare image name and tag
        id: image
        env:
          REQUESTED_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Image tag must be a valid Docker tag (1–128 letters, numbers, underscores, dots or hyphens).'
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'workflow_dispatch' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
