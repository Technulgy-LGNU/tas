# Only postgres is supported ;)
[database]
host = "localhost"
port = 5432
user = "technulgy_tas"
pass = "password"
database = "technulgy_tas_db"
timezone = "Europe/Berlin"

[server]
# The interface the server will listen on
host = "0.0.0.0"
# The port the server will listen on
port = 8000

[catigoal]
# Base URL for the Catigoal JSON API, including trailing slash or not.
base_url = "https://example.invalid/api/"

[auth]
# FusionAuth issuer, for example "https://auth.example.org".
issuer = ""
client_id = ""
required_role = "admin"
# Keep false in production. True lets local referee and admin APIs work without FusionAuth.
dev_allow_admin = true
