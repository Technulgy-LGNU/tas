# Only postgres is supported ;)
[database]
host = "localhost"
port = 5432
user = "technulgy_tas"
password = "password"
database = "technulgy_tas_db"
timezone = "Europe/Berlin"

[auth]
# Local development only: bypass FusionAuth and use a local admin.
# When true, TAS listens on 127.0.0.1 only. Restart after changing.
disable_fusionauth = false
# Address of the other laptop, reachable by your browser AND this backend.
fusionauth_url = "http://192.168.1.100:9011"
fusionauth_client_id = ""
fusionauth_client_secret = ""
fusionauth_tenant_id = ""
oauth_redirect_uri = "http://localhost:2005/auth/callback"
# Use http://localhost:5173/#/ when running Vite's dev server.
frontend_url = "http://localhost:2005/#/"
# Optional additional restriction, e.g. "admin". Empty allows all registered users.
required_role = ""

[cloudflare]
images_account_id = ""
images_api_token = ""
# Example: "https://imagedelivery.net/<account_hash>"
images_delivery_url = ""
images_variant = "public"

[website]
# Base URL of the separate public website (used for blog links).
public_url = "http://localhost:3000"
# Exact public website origins allowed to read the API and submit contact forms.
# No credentials/cookies are used for these public endpoints.
allowed_origins = ["http://localhost:3000"]

[website.contact]
# Contact form stays unavailable until SMTP is configured. TLS is always required.
smtp_host = ""
smtp_port = 587
smtp_username = ""
smtp_password = ""
# "starttls" (typically port 587) or "tls" (typically port 465).
tls_mode = "starttls"
from = ""
to = ""
