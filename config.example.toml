# Copy to your own config.toml and fill in credentials. Do not commit that file.
# Docker: set TAS_CONFIG_FILE in .env to its host path. It is mounted read-only
# at /app/config.toml. TAS reads this file at startup; recreate TAS after edits.
# Values are literal TOML: ${ENV_VAR} placeholders are NOT expanded by TAS.

[logging]
# JSON logs in docker compose logs. Use "debug" while diagnosing login/tunnels.
# Default when omitted: "info". Also supports "warn" and "error".
# No request bodies, cookies, tokens, or URL query strings are logged by this logger.
level = "info"

[database]
# "postgres" is the bundled Compose service. For go run, use your database host.
host = "postgres"
port = 5432
user = "technulgy_tas"
# Must match POSTGRES_PASSWORD in Compose's .env when using its database.
password = "change-me"
database = "technulgy_tas_db"
timezone = "Europe/Berlin"
# Startup automatically migrates image metadata and website content tables.
# This backend currently uses sslmode=disable; the bundled DB has no public port.

[auth]
# Keep false in Docker. The bypass binds to container loopback and cannot be
# reached through a published Docker port. Use true only for native local work.
disable_fusionauth = false
# A URL reachable by BOTH the browser and TAS container (e.g. the other laptop).
# localhost here would refer to the container, not the FusionAuth machine.
fusionauth_url = "http://192.168.1.100:9011"
fusionauth_client_id = ""
fusionauth_client_secret = ""
fusionauth_tenant_id = ""
# Browser-facing TAS URLs, not Docker service names. For a deployment, replace
# these with https://admin.your-domain.example/auth/callback and .../#/.
# Register the exact callback in FusionAuth. Frontend/callback must share origin.
oauth_redirect_uri = "http://localhost:2005/auth/callback"
frontend_url = "http://localhost:2005/#/"
# Leave empty to admit registered users, including editors. Roles still control
# editing (editor/admin) and deletion (admin). "admin" restricts the entire app.
required_role = ""
# FusionAuth: client authentication + PKCE required, application registration
# required, Authorization Code + Refresh Token grants, refresh tokens enabled.
# Disable self-service registration. Set its Logout URL to the frontend /#/login.

[cloudflare]
images_account_id = ""
# Account-scoped token with Images Write permission; backend only.
images_api_token = ""
# Delivery base INCLUDING the account hash, without an image ID or variant.
# Example: https://imagedelivery.net/<account_hash>
images_delivery_url = ""
# Existing public source variant used when images_transform_origin is configured.
# Keep its dimensions large enough for website images (at least 1920px wide).
images_variant = "public"
# Optional Cloudflare-proxied HTTPS origin, without a path (e.g. https://tas.example.com).
# Enable Image Transformations for that zone and allow imagedelivery.net as a
# source before setting this. TAS uses /cdn-cgi/image/... with explicit WebP.
images_transform_origin = ""
# If empty, use hosted Images with Flexible variants enabled. This resizes and
# compresses, but output format still depends on the caller's Accept header.
# Website images: max width 1920; admin previews: 640; quality 80, no upscaling.

[website]
# Base URL of the separate PUBLIC website, used to generate article links.
public_url = "http://localhost:3000"
# Exact browser origins (scheme + host + port, no path or trailing slash).
# Add the public website's deployed HTTPS origin here. No cookies are needed
# for /website/*; private /api/v1/* keeps its existing authentication checks.
allowed_origins = ["http://localhost:3000"]
# Public content supports ?lang=de or ?lang=en; only published content is served.

[website.contact]
# Contact email stays unavailable until these settings and the password are set.
smtp_host = "mail.technulgy.com"
smtp_port = 587
smtp_username = "noreply@technulgy.email"
smtp_password = ""
# Verified TLS is required: "starttls" on 587, or "tls" on 465.
tls_mode = "starttls"
from = "noreply@technulgy.email"
to = "elias.braun@technulgy.com"
# Visitor email is used only as Reply-To. Submitted messages are not stored.
