services:
  tas:
    build:
      context: .
      dockerfile: Dockerfile
    image: tas:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # When using the postgres service below, set [database].host = "postgres" in ./config.toml.
      - ./config.toml:/app/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: technulgy_tas
      POSTGRES_PASSWORD: password
      POSTGRES_DB: technulgy_tas_db
    volumes:
      - tas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technulgy_tas -d technulgy_tas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tas-postgres-data:
